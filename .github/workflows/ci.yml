name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"
      - "doc/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package modules
        run: mvn -B -ntp -pl web/web-admin,web/web-app -am -DskipTests package

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: packaged-jars
          path: |
            web/web-admin/target/*.jar
            web/web-app/target/*.jar

  api-core-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client curl
          npm install -g newman

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS fitness_platform DEFAULT CHARSET utf8mb4;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot fitness_platform < fitness_platform.sql

      - name: Reset test data
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot fitness_platform < tests/reset_test_data.sql

      - name: Start MinIO
        run: |
          docker run -d --name ci-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=root \
            -e MINIO_ROOT_PASSWORD=rootroot \
            minio/minio:latest server /data --console-address ":9001"
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio is up"
              exit 0
            fi
            sleep 2
          done
          echo "minio not ready in time"
          exit 1

      - name: Build
        run: mvn -B -ntp -pl web/web-admin,web/web-app -am -DskipTests compile

      - name: Install common/model to local maven repo
        run: mvn -B -ntp -pl common,model -am -DskipTests install

      - name: Start admin and app
        run: |
          nohup mvn -B -ntp -f web/web-admin/pom.xml -DskipTests spring-boot:run -Dspring-boot.run.arguments="--spring.data.redis.password= --fitness.auth.captcha.enabled=false" > admin.log 2>&1 &
          nohup mvn -B -ntp -f web/web-app/pom.xml -DskipTests spring-boot:run -Dspring-boot.run.arguments="--spring.data.redis.password= --fitness.auth.captcha.enabled=false" > app.log 2>&1 &

      - name: Wait services up
        run: |
          for i in {1..150}; do
            if curl -fsS http://127.0.0.1:8080/v3/api-docs >/dev/null && curl -fsS http://127.0.0.1:8081/v3/api-docs >/dev/null; then
              echo "apps are up"
              exit 0
            fi
            if (( i % 15 == 0 )); then
              echo "still waiting... ${i}"
              tail -n 40 admin.log || true
              tail -n 40 app.log || true
            fi
            sleep 2
          done
          echo "apps not ready in time"
          echo "===== admin.log ====="
          tail -n 200 admin.log || true
          echo "===== app.log ====="
          tail -n 200 app.log || true
          exit 1

      - name: Run Postman core regression
        run: |
          mkdir -p reports
          newman run tests/fitness-platform-core.postman_collection.json \
            -e tests/local.postman_environment.json \
            --working-dir "$GITHUB_WORKSPACE" \
            --env-var "videoFilePath=tests/assets/demo.mp4" \
            --reporters cli,junit,json \
            --reporter-junit-export reports/core-junit.xml \
            --reporter-json-export reports/core-report.json

      - name: Cleanup test data
        if: always()
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot fitness_platform < tests/reset_test_data.sql || true

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== admin.log ====="
          tail -n 200 admin.log || true
          echo "===== app.log ====="
          tail -n 200 app.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-app-logs
          path: |
            admin.log
            app.log

      - name: Upload core regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-regression-reports
          path: reports/*

      - name: Cleanup MinIO
        if: always()
        run: |
          docker rm -f ci-minio || true

  dual-instance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client curl

      - name: Init database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS fitness_platform DEFAULT CHARSET utf8mb4;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot fitness_platform < fitness_platform.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot fitness_platform < tests/reset_test_data.sql

      - name: Build
        run: mvn -B -ntp -pl web/web-admin,web/web-app -am -DskipTests compile

      - name: Install common/model to local maven repo
        run: mvn -B -ntp -pl common,model -am -DskipTests install

      - name: Start admin and dual app instances
        run: |
          nohup mvn -B -ntp -f web/web-admin/pom.xml -DskipTests spring-boot:run -Dspring-boot.run.arguments="--spring.data.redis.password= --fitness.auth.captcha.enabled=false" > admin.log 2>&1 &
          nohup mvn -B -ntp -f web/web-app/pom.xml -DskipTests spring-boot:run -Dspring-boot.run.arguments="--server.port=8081 --spring.data.redis.password= --fitness.auth.captcha.enabled=false" > app-8081.log 2>&1 &
          nohup mvn -B -ntp -f web/web-app/pom.xml -DskipTests spring-boot:run -Dspring-boot.run.arguments="--server.port=8082 --spring.data.redis.password= --fitness.auth.captcha.enabled=false" > app-8082.log 2>&1 &

      - name: Start nginx upstream
        run: |
          docker run -d --name ci-nginx --network host \
            -v "$GITHUB_WORKSPACE/deploy/nginx/fitness.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

      - name: Wait services up
        run: |
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:8080/v3/api-docs >/dev/null \
              && curl -fsS http://127.0.0.1:8081/v3/api-docs >/dev/null \
              && curl -fsS http://127.0.0.1:8082/v3/api-docs >/dev/null \
              && curl -fsS http://127.0.0.1/app/banner/list -H "Host: app.localhost" >/dev/null; then
              echo "dual instance stack is up"
              exit 0
            fi
            if (( i % 20 == 0 )); then
              echo "still waiting... ${i}"
              tail -n 30 admin.log || true
              tail -n 30 app-8081.log || true
              tail -n 30 app-8082.log || true
              docker logs ci-nginx --tail 30 || true
            fi
            sleep 2
          done
          echo "services not ready in time"
          exit 1

      - name: Verify round robin
        run: |
          pwsh -ExecutionPolicy Bypass -File tests/check-dual-app-routing.ps1 \
            -Url "http://localhost/app/banner/list" \
            -HostHeader "app.localhost" \
            -Requests 12 \
            -MinDistinctInstances 2

      - name: Acquire app token
        run: |
          LOGIN_JSON=$(curl -fsS http://127.0.0.1/app/auth/login \
            -H "Host: app.localhost" \
            -H "Content-Type: application/json" \
            -d '{"account":"root","password":"root","loginType":"password"}')
          APP_TOKEN=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['data']['accessToken'])" "$LOGIN_JSON")
          echo "APP_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

      - name: Verify JWT across instances
        run: |
          pwsh -ExecutionPolicy Bypass -File tests/check-dual-app-routing.ps1 \
            -Url "http://localhost/app/course/my/enrollments" \
            -HostHeader "app.localhost" \
            -Token "$APP_TOKEN" \
            -Requests 6 \
            -MinDistinctInstances 2

      - name: Run concurrent enrollment smoke
        run: |
          BODY='{"scheduleId":2}'
          pwsh -ExecutionPolicy Bypass -File tests/invoke-concurrent-requests.ps1 \
            -Url "http://localhost/app/course/enroll" \
            -HostHeader "app.localhost" \
            -Body "$BODY" \
            -Token "$APP_TOKEN" \
            -Concurrency 6

      - name: Assert enrollment results in database
        run: |
          ENROLL_COUNT=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT COUNT(*) FROM fitness_platform.course_enrollment WHERE user_id = 21 AND schedule_id = 2 AND is_deleted = 0;")
          BOOKED_COUNT=$(mysql -h 127.0.0.1 -P 3306 -uroot -proot -N -e "SELECT booked_count FROM fitness_platform.course_schedule WHERE id = 2;")
          echo "enroll_count=$ENROLL_COUNT"
          echo "booked_count=$BOOKED_COUNT"
          test "$ENROLL_COUNT" = "1"
          test "$BOOKED_COUNT" = "1"

      - name: Capture nginx logs
        if: always()
        run: docker logs ci-nginx > nginx.log 2>&1 || true

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-instance-smoke-logs
          path: |
            admin.log
            app-8081.log
            app-8082.log
            nginx.log

      - name: Cleanup stack
        if: always()
        run: |
          docker rm -f ci-nginx || true
          mysql -h 127.0.0.1 -P 3306 -uroot -proot fitness_platform < tests/reset_test_data.sql || true
