name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - "**/*.md"
      - "doc/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile modules
        run: mvn -B -ntp -pl web/web-admin,web/web-app -am -DskipTests compile
