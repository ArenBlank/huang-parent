server:
  port: ${APP_PORT:8081}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

minio:
  endpoint: ${MINIO_ENDPOINT}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT}}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET:lease}

payment:
  sign:
    mode: ${PAY_SIGN_MODE:hmac}
    secret: ${PAY_SIGN_SECRET:}

langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY}
      model-name: ${LLM_MODEL_NAME:deepseek-chat}
      timeout: ${LLM_TIMEOUT:60s}

development:
  enabled: ${FITNESS_DEV_ENABLED:false}
  fixed-sms-code: ${FITNESS_DEV_FIXED_SMS_CODE:}
  skip-sms-validation: ${FITNESS_DEV_SKIP_SMS:false}
  skip-captcha-validation: ${FITNESS_DEV_SKIP_CAPTCHA:false}
  test-username: ${FITNESS_DEV_TEST_USERNAME:}
  test-password: ${FITNESS_DEV_TEST_PASSWORD:}

fitness:
  jwt:
    secret: ${FITNESS_JWT_SECRET:}
    app-access-expire-ms: ${FITNESS_JWT_APP_ACCESS_EXPIRE_MS:7200000}
    app-refresh-expire-ms: ${FITNESS_JWT_APP_REFRESH_EXPIRE_MS:1296000000}
    admin-access-expire-ms: ${FITNESS_JWT_ADMIN_ACCESS_EXPIRE_MS:1800000}
    admin-refresh-expire-ms: ${FITNESS_JWT_ADMIN_REFRESH_EXPIRE_MS:604800000}
  auth:
    captcha:
      enabled: ${FITNESS_AUTH_CAPTCHA_ENABLED:true}
