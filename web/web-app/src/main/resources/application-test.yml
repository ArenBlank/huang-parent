server:
  port: ${APP_PORT:8093}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fitness_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      database: ${REDIS_DATABASE:0}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:root}
  secret-key: ${MINIO_SECRET_KEY:rootroot}
  bucket-name: ${MINIO_BUCKET:lease}

development:
  enabled: ${FITNESS_DEV_ENABLED:true}
  fixed-sms-code: ${FITNESS_DEV_FIXED_SMS_CODE:123456}
  skip-sms-validation: ${FITNESS_DEV_SKIP_SMS:true}
  skip-captcha-validation: ${FITNESS_DEV_SKIP_CAPTCHA:true}
  test-username: ${FITNESS_DEV_TEST_USERNAME:testuser}
  test-password: ${FITNESS_DEV_TEST_PASSWORD:123456}
