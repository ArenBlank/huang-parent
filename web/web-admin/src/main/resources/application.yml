server:
  port: ${ADMIN_PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: fitness-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://localhost:3306/fitness_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: root
    password: root
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 12
      minimum-idle: 10
      pool-name: SPHHikariPool
  jackson:
    time-zone: GMT+8
  data:
    redis:
      host: localhost
      port: 6379
      password: root
      database: 0
      timeout: 1500ms
      connect-timeout: 1000ms
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  mapper-locations:
    - classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://files.localhost}
  access-key: ${MINIO_ACCESS_KEY:root}
  secret-key: ${MINIO_SECRET_KEY:rootroot}
  bucket-name: ${MINIO_BUCKET:lease}

admin:
  permission:
    admin-all: true
    role-map:
      OPS_ADMIN:
        - dashboard:read
        - booking:read
        - booking:manage
        - booking:schedule
        - order:read
        - banner:manage
        - notice:manage
        - course:read
        - course:create
        - course:delete
        - course:publish
        - course:schedule
        - course:update
        - video:upload
        - video:asset
        - video:bind
        - video:status
        - system:config
        - task:run:read
        - task:run:trigger
      AUDIT_ADMIN:
        - refund:audit
        - pay:callback:audit
        - coach:apply:audit
        - operation:log:read
        - task:run:read
    course-category-scope:
      OPS_ADMIN:
        - 1

logging:
  pattern:
    level: "%5p [traceId:%X{traceId} userId:%X{userId}]"

springdoc:
  default-flat-param-object: true

app:
  instance-id: ${spring.application.name}:${server.port}

cache:
  invalidation:
    channel: cache:evict

aj:
  captcha:
    type: blockPuzzle
    cache-type: redis
    aes-status: true
    slip-offset: 5
    water-mark: FITNESS
    interference-options: 2
