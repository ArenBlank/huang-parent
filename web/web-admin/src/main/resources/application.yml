server:
  port: ${ADMIN_PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: fitness-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/fitness_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 12
      minimum-idle: 10
      pool-name: SPHHikariPool
  jackson:
    time-zone: GMT+8
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:root}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:1500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1000ms}
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  mapper-locations:
    - classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://127.0.0.1:9000}}
  access-key: ${MINIO_ACCESS_KEY:root}
  secret-key: ${MINIO_SECRET_KEY:rootroot}
  bucket-name: ${MINIO_BUCKET:lease}

admin:
  permission:
    admin-all: true
    role-map:
      OPS_ADMIN:
        - dashboard:read
        - booking:read
        - booking:manage
        - booking:schedule
        - order:read
        - banner:manage
        - notice:manage
        - course:read
        - course:create
        - course:delete
        - course:publish
        - course:schedule
        - course:update
        - video:upload
        - video:asset
        - video:bind
        - video:status
        - system:config
        - task:run:read
        - task:run:trigger
      AUDIT_ADMIN:
        - refund:audit
        - pay:callback:audit
        - coach:apply:audit
        - operation:log:read
        - task:run:read
    course-category-scope:
      OPS_ADMIN:
        - 1

logging:
  pattern:
    level: "%5p [traceId:%X{traceId} userId:%X{userId}]"

springdoc:
  default-flat-param-object: true

app:
  instance-id: ${spring.application.name}:${server.port}

cache:
  invalidation:
    channel: cache:evict

aj:
  captcha:
    type: blockPuzzle
    cache-type: redis
    aes-status: true
    slip-offset: 5
    water-mark: FITNESS
    interference-options: 2

development:
  enabled: ${FITNESS_DEV_ENABLED:true}
  fixed-sms-code: ${FITNESS_DEV_FIXED_SMS_CODE:123456}
  skip-sms-validation: ${FITNESS_DEV_SKIP_SMS:true}
  skip-captcha-validation: ${FITNESS_DEV_SKIP_CAPTCHA:true}
  test-username: ${FITNESS_DEV_TEST_USERNAME:testuser}
  test-password: ${FITNESS_DEV_TEST_PASSWORD:123456}

fitness:
  jwt:
    secret: ${FITNESS_JWT_SECRET:}
    app-access-expire-ms: ${FITNESS_JWT_APP_ACCESS_EXPIRE_MS:7200000}
    app-refresh-expire-ms: ${FITNESS_JWT_APP_REFRESH_EXPIRE_MS:1296000000}
    admin-access-expire-ms: ${FITNESS_JWT_ADMIN_ACCESS_EXPIRE_MS:1800000}
    admin-refresh-expire-ms: ${FITNESS_JWT_ADMIN_REFRESH_EXPIRE_MS:604800000}
  auth:
    captcha:
      enabled: ${FITNESS_AUTH_CAPTCHA_ENABLED:true}
