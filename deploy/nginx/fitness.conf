server {
    listen 80;
    server_name _;

    client_max_body_size 200m;

    location /admin/ {
        proxy_pass http://127.0.0.1:8080/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /app/ {
        proxy_pass http://127.0.0.1:8081/app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs/admin {
        proxy_pass http://127.0.0.1:8080/v3/api-docs;
    }

    location /v3/api-docs/app {
        proxy_pass http://127.0.0.1:8081/v3/api-docs;
    }

    location /doc/admin {
        proxy_pass http://127.0.0.1:8080/doc.html;
    }

    location /doc/app {
        proxy_pass http://127.0.0.1:8081/doc.html;
    }
}
