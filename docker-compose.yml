name: huang-fitness

services:
  mysql:
    image: mysql:8.0
    container_name: huang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitness_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./fitness_platform.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./docker/mysql/data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    profiles: ["infra-local"]

  redis:
    image: redis:7.2
    container_name: huang-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "root"]
    profiles: ["infra-local"]

  minio:
    image: minio/minio:latest
    container_name: huang-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootroot
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/minio/data:/data
    command: ["server", "/data", "--console-address", ":9001"]
